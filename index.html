<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0c0e" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tiefgang" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Tiefgang</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: fixed;
        inset: 0;
        background: #0b0c0e;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      * {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-user-drag: none;
      }
      #app,
      #app canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        outline: none;
      }
      /* Probe that resolves env() safe-area insets (plus Capacitor's Android CSS vars) to pixels. */
      #safe-probe {
        position: fixed;
        visibility: hidden;
        pointer-events: none;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        padding-top: max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px));
        padding-right: max(env(safe-area-inset-right, 0px), var(--safe-area-inset-right, 0px));
        padding-bottom: max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px));
        padding-left: max(env(safe-area-inset-left, 0px), var(--safe-area-inset-left, 0px));
      }
    </style>
  </head>
  <body>
    <div id="safe-probe"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
